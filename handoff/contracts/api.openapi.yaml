openapi: 3.1.0
info:
  title: ShiftClarity future pilot API boundary
  version: 1.0.0
  description: Design contract, not an implemented API. Current authorization is local
    synthetic demo. Pilot requires separate data/security/deployment approval. JWT
    identity is verified server-side; no tenant/actor authority from payloads. Further
    endpoints for draft authoring must be approved with the corresponding requirements,
    not guessed from this skeleton.
servers:
- url: /api/v1
security:
- BearerAuth: []
paths:
  /runs/latest:
    get:
      operationId: getLatestCompletedRun
      description: Latest atomically published completed run. Coverage may still be
        partial.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404': &id001
          description: Access denied, invalid state, unsafe/unsupported input or conflict.
            No write occurs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id001
        '403': *id001
  /runs:
    post:
      operationId: createRun
      parameters:
      - &id002
        name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - batch_ids
              - rule_version_ids
              - as_of
              properties:
                batch_ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                rule_version_ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                as_of:
                  type: string
                  format: date-time
      responses:
        '202':
          description: Accepted; not yet published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401': *id001
        '403': *id001
        '409': *id001
        '422': *id001
  /runs/{run_id}/coverage:
    get:
      operationId: getRunCoverage
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
        '401': *id001
        '403': *id001
        '404': *id001
  /runs/{run_id}/findings:
    get:
      operationId: listRunFindings
      description: Filters affect rows only, not the run coverage denominator. Cursor
        pagination is stable within a run.
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: state
        in: query
        schema:
          type: string
      - name: facility_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                - total_matching
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Finding'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  total_matching:
                    type: integer
        '401': *id001
        '403': *id001
        '404': *id001
  /findings/{finding_id}:
    get:
      operationId: getFindingEvidence
      parameters:
      - name: finding_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
        '401': *id001
        '403': *id001
        '404': *id001
  /findings/{finding_id}/decisions:
    post:
      operationId: recordDecision
      description: Authorizes actor server-side, checks version/fingerprint, stores
        one audit event. No invoice write or message.
      parameters:
      - name: finding_id
        in: path
        required: true
        schema:
          type: string
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewEvent'
        '401': *id001
        '403': *id001
        '409': *id001
        '422': *id001
  /imports:
    post:
      operationId: ingestApprovedExport
      description: Pilot-only safe upload. Allowed schemas/limits configured per source;
        quarantined until validated. No arbitrary patient files.
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - source
              - source_as_of
              - declared_complete
              properties:
                file:
                  type: string
                  format: binary
                source:
                  type: string
                source_as_of:
                  type: string
                  format: date-time
                declared_complete:
                  type: boolean
                service_from:
                  type: string
                  format: date
                service_to_exclusive:
                  type: string
                  format: date
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '401': *id001
        '403': *id001
        '413': *id001
        '415': *id001
        '422': *id001
  /imports/{batch_id}:
    get:
      operationId: getBatch
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '401': *id001
        '403': *id001
        '404': *id001
  /rules/{rule_id}:
    get:
      operationId: getRuleVersion
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleVersion'
        '401': *id001
        '403': *id001
        '404': *id001
  /rules/{rule_id}/approval:
    post:
      operationId: decideRuleApproval
      description: Separate approver required. Validates source, supersession and
        interval conflict. Never edits approved predecessor.
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - action
              - reason
              - expected_version
              properties:
                action:
                  enum:
                  - approve
                  - reject
                reason:
                  type: string
                  minLength: 3
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleVersion'
        '401': *id001
        '403': *id001
        '409': *id001
        '422': *id001
  /documents/{document_id}/access:
    get:
      operationId: getAuthorizedDocumentLink
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
      description: Check current identity/permissions before generating a short-lived
        private URL. No permanent public URLs.
      responses:
        '200':
          description: Authorized temporary access
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                - expires_at
                properties:
                  url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
        '401': *id001
        '403': *id001
        '404': *id001
  /runs/{run_id}/review-export:
    get:
      operationId: exportReviewedFindings
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      description: Authorized reviewed CSV with source/run IDs and coverage limitations.
        Formula-safe text. No recovered/collected claims.
      responses:
        '200':
          description: Reviewed findings CSV
          content:
            text/csv:
              schema:
                type: string
        '401': *id001
        '403': *id001
        '404': *id001
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Trusted identity provider; exact issuer/audience chosen at approved
        pilot. Not a demo role switch.
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
    Money:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)\.[0-9]{2}$
      description: Signed USD decimal string; never binary float.
    CoverageBucket:
      type: object
      required:
      - records
      - minutes
      properties:
        records:
          type: integer
          minimum: 0
        minutes:
          type: integer
          minimum: 0
    Coverage:
      type: object
      required:
      - received_records
      - received_minutes
      - evaluated_records
      - evaluated_minutes
      - categories
      - limitations
      properties:
        received_records:
          type: integer
        received_minutes:
          type: integer
        evaluated_records:
          type: integer
        evaluated_minutes:
          type: integer
        rejected_input_rows:
          type: integer
          minimum: 0
        categories:
          type: object
          required:
          - evaluated_aligned
          - evaluated_flagged
          - abstained
          - not_evaluated
          properties:
            evaluated_aligned:
              $ref: '#/components/schemas/CoverageBucket'
            evaluated_flagged:
              $ref: '#/components/schemas/CoverageBucket'
            abstained:
              $ref: '#/components/schemas/CoverageBucket'
            not_evaluated:
              $ref: '#/components/schemas/CoverageBucket'
        limitations:
          type: array
          items:
            type: string
        expected_value_known:
          type: boolean
    Run:
      type: object
      required:
      - id
      - state
      - manifest
      - coverage
      properties:
        id:
          type: string
        state:
          enum:
          - queued
          - validating
          - reconciling
          - completed
          - failed
        manifest:
          type: object
          required:
          - batch_ids
          - rule_version_ids
          - engine_version
          - as_of
          - fingerprint
          properties:
            batch_ids:
              type: array
              items:
                type: string
            rule_version_ids:
              type: array
              items:
                type: string
            engine_version:
              type: string
            as_of:
              type: string
              format: date-time
            fingerprint:
              type: string
          additionalProperties: false
        coverage:
          oneOf:
          - $ref: '#/components/schemas/Coverage'
          - type: 'null'
          description: Null before successful completion. Completed runs must carry
            coverage; failed or pending runs are never presented as a completed review.
        published_at:
          type:
          - string
          - 'null'
          format: date-time
    Finding:
      type: object
      required:
      - id
      - run_id
      - state
      - evidence_fingerprint
      - version
      - shift_ids
      - reason_code
      - expected_amount
      - invoiced_amount
      - discrepancy_amount
      - source_refs
      properties:
        id:
          type: string
        run_id:
          type: string
        state:
          enum:
          - needs_review
          - confirmed
          - dismissed
          - evidence_requested
        evidence_fingerprint:
          type: string
        version:
          type: integer
          minimum: 1
        shift_ids:
          type: array
          items:
            type: string
        reason_code:
          type: string
        expected_amount:
          $ref: '#/components/schemas/Money'
        invoiced_amount:
          $ref: '#/components/schemas/Money'
        discrepancy_amount:
          $ref: '#/components/schemas/Money'
        source_refs:
          type: array
          items:
            type: object
            required:
            - id
            - kind
            properties:
              id:
                type: string
              kind:
                enum:
                - document
                - work_record
                - invoice_line
                - rule_version
        currency:
          const: USD
        history:
          type: array
          items:
            $ref: '#/components/schemas/ReviewEvent'
    ReviewEvent:
      type: object
      required:
      - id
      - actor_id
      - action
      - reason
      - created_at
      properties:
        id:
          type: string
        actor_id:
          type: string
          description: Set server-side from authenticated identity.
        action:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
    DecisionRequest:
      type: object
      additionalProperties: false
      required:
      - action
      - reason
      - expected_fingerprint
      - expected_version
      properties:
        action:
          enum:
          - confirm
          - dismiss
          - request_evidence
        reason:
          type: string
          minLength: 3
          maxLength: 2000
        expected_fingerprint:
          type: string
          minLength: 8
        expected_version:
          type: integer
          minimum: 1
    Batch:
      type: object
      required:
      - id
      - state
      - source
      - source_as_of
      - declared_complete
      properties:
        id:
          type: string
        state:
          enum:
          - received
          - quarantined
          - validating
          - validated
          - failed
        source:
          type: string
        source_as_of:
          type: string
          format: date-time
        declared_complete:
          type: boolean
        received_rows:
          type: integer
        accepted_rows:
          type: integer
        rejected_rows:
          type: integer
        warnings:
          type: array
          items:
            type: string
    RuleVersion:
      type: object
      required:
      - id
      - state
      - rate
      - currency
      - effective_from
      - source_excerpt_id
      - author_id
      - version
      properties:
        id:
          type: string
        state:
          enum:
          - draft
          - pending_approval
          - approved
          - rejected
        rate:
          type: string
          pattern: ^(0|[1-9][0-9]*)\.[0-9]{4}$
        currency:
          const: USD
        effective_from:
          type: string
          format: date
        effective_to:
          type:
          - string
          - 'null'
          format: date
        source_excerpt_id:
          type: string
        author_id:
          type: string
        approver_id:
          type:
          - string
          - 'null'
        supersedes:
          type:
          - string
          - 'null'
        version:
          type: integer
          minimum: 1
          description: Optimistic concurrency revision. Distinct from the immutable
            semantic rule-version identifier.
