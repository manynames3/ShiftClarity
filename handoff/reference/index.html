function filterFindings(){const f=document.getElementById('facility-filter').value,q=document.getElementById('finding-search').value.toLowerCase().trim();let visible=0;document.querySelectorAll('tr[data-facility]').forEach(r=>{const show=(f==='all'||r.dataset.facility===f)&&(!q||r.dataset.search.includes(q));r.hidden=!show;if(show)visible++});document.getElementById('filter-empty').hidden=visible!==0;document.getElementById('result-count').textContent=visible+' matching finding'+(visible===1?'':'s')+' · Review coverage unchanged'}
const originalEvidence=document.getElementById('evidence-doc')?.innerHTML;
function showEvidenceTab(tab,el){document.querySelectorAll('.source-tabs a').forEach(x=>x.classList.remove('active'));el.classList.add('active');const target=document.getElementById('evidence-doc'),missing=params.get('case')==='missing';if(tab==='contract'){target.innerHTML=originalEvidence;return}if(tab==='work'){target.innerHTML=`<div class="document-label">${icon('rows')}BATCH-TIME-001 · Synthetic work export</div><h3>${missing?'24 approved hours':'40 approved hours'}</h3><p>${missing?'S005 and S006':'S001 through S004'} are approved standard RN work records for ${missing?'October 6–7':'October 5–8'}, 2026.</p><p><mark>Service dates determine the applicable approved rate, not the entry date.</mark></p><p>Identity is explicit in the supplied fixture. The sample has no ambiguous person-name matching.</p><div class="doc-rule">${icon('check')}Work source as of October 12, 2026 · 4:00 PM EDT</div>`}else{target.innerHTML=`<div class="document-label">${icon('file')}BATCH-INV-001 · Synthetic posted extract</div><h3>${missing?'No allocation after the cutoff':'Invoice INV-001'}</h3><p>${missing?'The supplied complete extract contains no posted invoice allocation for S005 or S006.':'LINE-001 through LINE-004 each invoice ten hours at the old rate of USD 60.00.'}</p><p><mark>${missing?'The synthetic billing cutoff is October 12 at 12:00 PM EDT.':'Net billed: USD 2,400.00. Expected under the approved amendment: USD 2,600.00.'}</mark></p><p>Completeness is explicitly declared for the sample scope. A real workflow must establish this from reliable source controls.</p><div class="doc-rule">${icon('info')}This is a potential discrepancy, not collected funds.</div>`}}
</script></body></html>
